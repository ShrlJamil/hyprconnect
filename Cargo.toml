[package]
name = "hyprconnect"
version = "1.0.0"
edition = "2021"
description = "Compact KDE Connect-compatible daemon and GTK 4 app for Hyprland"
license = "GPL-3.0-or-later"

[[bin]]
name = "hyprconnect"
path = "src/main.rs"

[[bin]]
name = "hyprconnect-app"
path = "src/bin/hyprconnect-app.rs"
required-features = ["gtk-ui"]

[features]
gtk-ui = ["dep:gtk4", "dep:adw"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x509-parser = "0.16"
socket2 = "0.5"
anyhow = "1"
ureq = { version = "2", features = ["tls"] }
gtk4 = { version = "0.10", optional = true, features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.8", optional = true, features = ["v1_5"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libc = "0.2"
zbus = { version = "5", features = ["tokio"] }
futures-lite = "2"
